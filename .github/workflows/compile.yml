name: Compile SA-MP

on:
  push:
    branches: [ main ]

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup and Compile
        run: |
          wget https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-linux.tar.gz
          tar -xzf pawnc-3.10.10-linux.tar.gz
          chmod +x pawnc-3.10.10-linux/bin/pawncc
          export LD_LIBRARY_PATH=$(pwd)/pawnc-3.10.10-linux/lib

          mkdir -p pawno/include

          # تحميل core.inc وباقي ملفات pawn الأساسية
          wget -q -O pawno/include/core.inc https://raw.githubusercontent.com/pawn-lang/compiler/master/include/core.inc || true
          wget -q -O pawno/include/float.inc https://raw.githubusercontent.com/pawn-lang/compiler/master/include/float.inc || true
          wget -q -O pawno/include/string.inc https://raw.githubusercontent.com/pawn-lang/compiler/master/include/string.inc || true
          wget -q -O pawno/include/file.inc https://raw.githubusercontent.com/pawn-lang/compiler/master/include/file.inc || true

          # تحميل مكتبات SA-MP
          wget -q -O pawno/include/a_samp.inc https://raw.githubusercontent.com/pawn-lang/samp-stdlib/master/a_samp.inc || true
          wget -q -O pawno/include/a_mysql.inc https://raw.githubusercontent.com/pBlueG/SA-MP-MySQL/master/include/a_mysql.inc || true
          wget -q -O pawno/include/sscanf2.inc https://raw.githubusercontent.com/Y-Less/sscanf/master/sscanf2.inc || true
          wget -q -O pawno/include/zcmd.inc https://raw.githubusercontent.com/zeex/zcmd/master/zcmd.inc || true
          wget -q -O pawno/include/streamer.inc https://raw.githubusercontent.com/samp-incognito/samp-streamer-plugin/master/include/streamer.inc || true

          $(pwd)/pawnc-3.10.10-linux/bin/pawncc rp_main.pwn -i$(pwd)/pawno/include -o$(pwd)/rp_main.amx

      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: rp_main_amx
          path: rp_main.amx
