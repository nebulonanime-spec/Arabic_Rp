name: Compile SA-MP

on:
  push:
    branches: [ main ]

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup and Compile
        run: |
          # تنزيل الكومبايلر
          wget https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-linux.tar.gz
          tar -xzf pawnc-3.10.10-linux.tar.gz
          chmod +x pawnc-3.10.10-linux/bin/pawncc
          export LD_LIBRARY_PATH=$(pwd)/pawnc-3.10.10-linux/lib

          # تجهيز الـ includes في مجلد واحد
          mkdir -p includes
          cp pawnc-3.10.10-linux/include/*.inc includes/
          wget -q -O includes/a_samp.inc https://raw.githubusercontent.com/pawn-lang/samp-stdlib/master/a_samp.inc || true
          wget -q -O includes/a_mysql.inc https://raw.githubusercontent.com/pBlueG/SA-MP-MySQL/master/include/a_mysql.inc || true
          wget -q -O includes/sscanf2.inc https://raw.githubusercontent.com/Y-Less/sscanf/master/sscanf2.inc || true
          wget -q -O includes/zcmd.inc https://raw.githubusercontent.com/zeex/zcmd/master/zcmd.inc || true

          # تأكد من وجود core.inc
          ls includes/ | grep core

          # كومبايل
          $(pwd)/pawnc-3.10.10-linux/bin/pawncc rp_main.pwn -i$(pwd)/includes -o$(pwd)/rp_main.amx

      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: rp_main_amx
          path: rp_main.amx
