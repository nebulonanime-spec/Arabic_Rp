name: Compile SA-MP

on:
  push:
    branches: [ main ]

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup and Compile
        run: |
          # 1. تحميل وتجهيز المترجم
          wget -q https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-linux.tar.gz
          tar -xzf pawnc-3.10.10-linux.tar.gz
          chmod +x pawnc-3.10.10-linux/bin/pawncc
          export LD_LIBRARY_PATH=$(pwd)/pawnc-3.10.10-linux/lib
          
          # 2. تجهيز مجلدات المكتبات
          mkdir -p pawno/include/YSI_Storage
          
          # 3. تحميل المكتبات الأساسية (بدون || true - يجب أن تنجح)
          wget -q -O pawno/include/core.inc https://raw.githubusercontent.com/pawn-lang/samp-stdlib/master/core.inc
          wget -q -O pawno/include/a_samp.inc https://raw.githubusercontent.com/pawn-lang/samp-stdlib/master/a_samp.inc
          wget -q -O pawno/include/sscanf2.inc https://raw.githubusercontent.com/Y-Less/sscanf/master/sscanf2.inc
          wget -q -O pawno/include/zcmd.inc https://raw.githubusercontent.com/zeex/zcmd/master/zcmd.inc
          
          # 4. تحميل y_ini
          wget -q -O pawno/include/YSI_Storage/y_ini.inc https://raw.githubusercontent.com/pawn-lang/YSI-Includes/master/YSI_Storage/y_ini.inc
          
          # 5. التحقق من أن الملفات تم تحميلها بشكل صحيح
          if [ ! -s pawno/include/a_samp.inc ]; then
            echo "خطأ: فشل تحميل a_samp.inc"
            exit 1
          fi
          
          # 6. التجميع
          ./pawnc-3.10.10-linux/bin/pawncc rp_main.pwn -i"pawno/include" -o"rp_main.amx" -";"

      - name: Upload AMX
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rp_main_amx
          path: rp_main.amx
