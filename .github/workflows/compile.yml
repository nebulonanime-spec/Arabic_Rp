name: Compile SA-MP

on:
  push:
    branches: [ main ]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pawn Compiler
        run: |
          mkdir pawn_compiler
          cd pawn_compiler
          wget https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-linux.tar.gz
          tar -xzf pawnc-3.10.10-linux.tar.gz
          chmod +x bin/pawncc
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Compile
        run: |
          pawncc rp_main.pwn -irp_main -o rp_main.amx

      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: rp_main_amx
          path: rp_main.amx
