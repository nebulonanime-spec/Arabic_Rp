name: Compile SA-MP

on:
  push:
    branches: [ main ]

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Pawn Compiler
        run: |
          wget https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-linux.tar.gz
          tar -xzf pawnc-3.10.10-linux.tar.gz
          chmod +x pawnc-3.10.10-linux/bin/pawncc
          echo "$(pwd)/pawnc-3.10.10-linux/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=$(pwd)/pawnc-3.10.10-linux/lib" >> $GITHUB_ENV

      - name: Download Includes
        run: |
          mkdir -p includes
          wget -q -O includes/a_samp.inc https://raw.githubusercontent.com/pawn-lang/samp-stdlib/master/a_samp.inc
          wget -q -O includes/a_mysql.inc https://raw.githubusercontent.com/pBlueG/SA-MP-MySQL/master/include/a_mysql.inc
          wget -q -O includes/sscanf2.inc https://raw.githubusercontent.com/Y-Less/sscanf/master/sscanf2.inc
          wget -q -O includes/zcmd.inc https://raw.githubusercontent.com/zeex/zcmd/master/zcmd.inc

      - name: Compile
        run: |
          PAWNCC=$(pwd)/pawnc-3.10.10-linux/bin/pawncc
          $PAWNCC rp_main.pwn -i$(pwd)/includes -i$(pwd)/pawnc-3.10.10-linux/include -o rp_main.amx

      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: rp_main_amx
          path: rp_main.amx
