name: Compile SA-MP

on:
  push:
    branches: [ main ]

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup and Compile
        run: |
          wget https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-linux.tar.gz
          tar -xzf pawnc-3.10.10-linux.tar.gz

          chmod +x pawnc-3.10.10-linux/bin/pawncc

          export LD_LIBRARY_PATH=$(pwd)/pawnc-3.10.10-linux/lib

          mkdir -p pawno/include

          # includes تبعتك
          wget -q -O pawno/include/a_samp.inc https://raw.githubusercontent.com/pawn-lang/samp-stdlib/master/a_samp.inc
          wget -q -O pawno/include/a_mysql.inc https://raw.githubusercontent.com/pBlueG/SA-MP-MySQL/master/include/a_mysql.inc
          wget -q -O pawno/include/sscanf2.inc https://raw.githubusercontent.com/Y-Less/sscanf/master/sscanf2.inc
          wget -q -O pawno/include/zcmd.inc https://raw.githubusercontent.com/zeex/zcmd/master/zcmd.inc
          wget -q -O pawno/include/streamer.inc https://raw.githubusercontent.com/samp-incognito/samp-streamer-plugin/master/include/streamer.inc

          # 🔥 الحل هنا:
          # ضفنا include تبع المترجم نفسه
          $(pwd)/pawnc-3.10.10-linux/bin/pawncc rp_main.pwn \
          -i$(pwd)/pawno/include \
          -i$(pwd)/pawnc-3.10.10-linux/include \
          -o$(pwd)/rp_main.amx

      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: rp_main_amx
          path: rp_main.amx
